# docker-compose.yml — Loan Risk Assessment System
# Services: db + api + frontend

version: '3.8'

services:

  # ── PostgreSQL Database
  db:
    image: postgres:15
    container_name: loan_risk_db
    restart: always
    environment:
      POSTGRES_USER     : ${DB_USER}
      POSTGRES_PASSWORD : ${DB_PASSWORD}
      POSTGRES_DB       : ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test     : ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval : 10s
      timeout  : 5s
      retries  : 5


  # ── FastAPI Backend
  api:
    build:
      context    : .
      dockerfile : Dockerfile.api
    container_name: loan_risk_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST     : db
      DB_PORT     : 5432
      DB_NAME     : ${DB_NAME}
      DB_USER     : ${DB_USER}
      DB_PASSWORD : ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app


  # ── Streamlit Frontend
  frontend:
    build:
      context    : .
      dockerfile : Dockerfile.frontend
    container_name: loan_risk_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api


# ── Volumes
volumes:
  postgres_data: