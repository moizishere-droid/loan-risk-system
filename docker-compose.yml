# Local development: one combined app container plus PostgreSQL.
# Hugging Face uses the same root Dockerfile with your external database Secret.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      POSTGRES_DB: ${DB_NAME:-loan_risk_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7860}:7860"
    environment:
      # Explicitly use the local database, even if .env has a Neon URL.
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-loan_risk_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
